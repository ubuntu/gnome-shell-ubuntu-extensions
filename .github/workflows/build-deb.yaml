name: Build debian packages

on:
  push:
    branches: "*"
    tags:
      - "*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deb-packages:
    name: Ubuntu Devel
    runs-on: ubuntu-latest
    env:
      UBUNTU_VERSION: devel
    outputs:
      pkg-src-changes: ${{ env.PKG_SOURCE_CHANGES }}
      ubuntu-image: ubuntu:${{ env.UBUNTU_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare sources
        uses: kohlerdominik/docker-run-action@v2.0.0
        id: sources-prepare
        with:
          image: ubuntu:${{ env.UBUNTU_VERSION }}
          environment: |
            TERM=dumb
            DEBIAN_FRONTEND=noninteractive
            DEBCONF_NONINTERACTIVE_SEEN=true
            DEB_BUILD_PROFILE=nocheck
          volumes: |
            ${{ github.workspace }}:${{ github.workspace }}
          workdir: ${{ github.workspace }}
          shell: bash
          run: |
            echo "::group::Installing build dependencies"
            apt update -y
            apt install -y git-buildpackage
            apt build-dep -y . --build-profiles=${DEB_BUILD_PROFILE}
            echo "::endgroup::"

            echo "::group::Building source package with gbp"
            mkdir sources
            git config --system --add safe.directory "${PWD}"
            gbp buildpackage --git-export-dir="$PWD/sources" \
              --git-ignore-branch -S --no-sign --build-profiles=${DEB_BUILD_PROFILE}
            find sources
            pkg_dsc=$(ls -1 sources/*.dsc)
            (
              echo "pkg-dsc=$(basename "${pkg_dsc}")"
              echo "pkg-dsc-path=${{ github.workspace }}/${pkg_dsc}"
            ) >> "${GITHUB_OUTPUT}"
            echo "::endgroup::"

      - name: Build debian packages
        uses: canonical/desktop-engineering/gh-actions/common/build-debian@main
        with:
          docker-image: ubuntu:${{ env.UBUNTU_VERSION }}
          from-sources-file: ${{ steps.sources-prepare.outputs.pkg-dsc-path }}
          extra-source-build-deps: ''

      # Reuse the sources generated by the build step so autopkgtest reuses them
      - name: Save built source package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-source
          path: ${{ env.SOURCE_OUTPUT_DIR }}
          if-no-files-found: error

  autopkgtest:
    name: Run autopkgtests
    runs-on: ubuntu-latest
    needs: build-deb-packages
    if: ${{ github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Run autopkgtests
        uses: canonical/desktop-engineering/gh-actions/common/run-autopkgtest@main
        with:
          source-changes: ${{ needs.build-deb-packages.outputs.pkg-src-changes }}
          lxd-image: ${{ needs.build-deb-packages.outputs.ubuntu-image }}
