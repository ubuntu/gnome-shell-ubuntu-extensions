name: Build debian packages

permissions:
  contents: read

on:
  push:
    branches: "**"
    tags:
      - "*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-modified-files:
    name: Check modified files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-autopkgtest: ${{ steps.collect.outputs.run-autopkgtest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect modified files
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu

          modified_files='[]'
          should_run_autopkgtest=false

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            should_run_autopkgtest=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            modified_files=$(gh pr diff ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --name-only | jq -Rsc 'split("\n")[:-1]')
          elif [ "${{ github.event_name }}" = "push" ]; then
            range_start="${{ github.event.before }}"
            range_end="${{ github.sha }}"

            if [ "${range_start}" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse "${range_end}^" >/dev/null 2>&1; then
                range_start="${range_end}^"
              else
                range_start="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
              fi
            fi

            modified_files=$(git diff --name-only "${range_start}" "${range_end}" | jq -Rsc 'split("\n")[:-1]')
          fi

          if [ "${should_run_autopkgtest}" != true ]; then
            should_run_autopkgtest=$(printf '%s\n' "${modified_files}" | jq -r '
              any(.[]; startswith("debian/tests/") or
                       . == "debian/gjs-check-runtime-dependencies.sh" or
                       . == ".github/workflows/build-deb.yaml")
            ')
          fi

          echo "run-autopkgtest=${should_run_autopkgtest}" >> "${GITHUB_OUTPUT}"

  build-deb-packages:
    name: Ubuntu Devel
    runs-on: ubuntu-latest
    env:
      UBUNTU_VERSION: devel
    outputs:
      pkg-src-changes: ${{ steps.sources-prepare.outputs.pkg-src-changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare sources
        uses: kohlerdominik/docker-run-action@v2.0.0
        id: sources-prepare
        with:
          image: ubuntu:${{ env.UBUNTU_VERSION }}
          environment: |
            TERM=dumb
            DEBIAN_FRONTEND=noninteractive
            DEBCONF_NONINTERACTIVE_SEEN=true
            DEB_BUILD_PROFILE=nocheck
          volumes: |
            ${{ github.workspace }}:${{ github.workspace }}
          workdir: ${{ github.workspace }}
          shell: bash
          run: |
            apt update -y
            apt install -y git-buildpackage
            apt build-dep -y . --build-profiles=${DEB_BUILD_PROFILE}
            mkdir sources
            git config --system --add safe.directory "${PWD}"
            gbp buildpackage --git-export-dir="$PWD/sources" \
              --git-ignore-branch -S --no-sign --build-profiles=${DEB_BUILD_PROFILE}
            find sources
            pkg_dsc=$(ls -1 sources/*.dsc)
            pkg_src_changes=$(ls -1 sources/*_source.changes)
            (
              echo "pkg-dsc=$(basename "${pkg_dsc}")"
              echo "pkg-dsc-path=${{ github.workspace }}/${pkg_dsc}"
              echo "pkg-src-changes=$(basename "${pkg_src_changes}")"
            ) >> "${GITHUB_OUTPUT}"

      - name: Save source package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-source
          path: ${{ github.workspace }}/sources
          if-no-files-found: error

      - name: Build debian packages
        uses: canonical/desktop-engineering/gh-actions/common/build-debian@main
        with:
          docker-image: ubuntu:${{ env.UBUNTU_VERSION }}
          from-sources-file: ${{ steps.sources-prepare.outputs.pkg-dsc-path }}
          extra-source-build-deps: ''

  autopkgtest:
    name: Run autopkgtests
    runs-on: ubuntu-latest
    needs:
      - build-deb-packages
      - check-modified-files
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      ((github.event_name == 'pull_request' || github.event_name == 'push') &&
       needs.check-modified-files.outputs.run-autopkgtest == 'true') }}
    env:
      UBUNTU_VERSION: devel

    steps:
      - name: Download source package artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: debian-source
          path: ${{ github.workspace }}/sources

      - name: Run autopkgtests
        uses: canonical/desktop-engineering/gh-actions/common/run-autopkgtest@main
        with:
          lxd-image: ubuntu:${{ env.UBUNTU_VERSION }}
          source-changes: ${{ github.workspace }}/sources/${{ needs.build-deb-packages.outputs.pkg-src-changes }}
